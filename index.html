<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title></title>
    <style>
      html, body { width:100vw; height:100vh}
      :root{color-scheme:light dark}
      table,th,tr,td,tbody{border:0;border-spacing: 0;}
      td{width:35px;height:35px;line-height: 0;}
      td>button{width:35px;height:35px;border-radius:0; border-width:0.125px}
      *{margin:0;padding:0;box-sizing:border-box;border-collapse:collapse;}
      #gameOver,#gameWin{
        margin: auto;
        inset: 0;
      }
      #game{flex:1;display:flex;min-width: 0;max-width: 100vw;}
      #sidebar{flex:0 0 25%;text-align: center;}
      #mains{min-width: 0;flex:0 0 75%;display:flex;}
      @media (max-width: 800px) {
        #game {
          flex-wrap: wrap;
        }
        #sidebar,#mains {
          flex:none;width: 100%;
        }
        #mains{height:100%}
      }
    </style>
  </head>
  <body style="display:flex;flex-direction: column;">
    <header><h1>FIND THE UNICORN:</h1></header>
    <main id=game>
      <div id=mains>
        <table cellspacing="0" cellpadding="0" id=main style="display:inline-table;min-width: 0;table-layout: fixed;width:100%"></table>
      </div>
      <div id=sidebar><h2>high scores:</h2><hr><ol style=display:inline-block;list-style-position:inside; id=hallOfFame></ol><hr><hr><h2>low scores:</h2><hr><ol style=display:inline-block;list-style-position:inside; id=hallOfShame></ol></div>
    </main>
    <footer></footer>
    <dialog id=gameWin style="text-align: center;">
      <h2>YOU FOUND UNICORN!!!</h2>
      <picture>
        <source srcset="unicorn_light_min.svg" media="(prefers-color-scheme: dark)">
        <img src="unicorn_dark_min.svg" alt="svg drawing of a unicorn" style=height:20vw;aspect-ratio:1>
      </picture>
      <p>it took you <span id=clickNum></span> clicks and <span id=timeLen></span> seconds</p>
      <button onclick="download()">DOWNLOAD MAP.</button> | <button onclick="location.reload()">RESTART?</button>
    </dialog>
    <dialog id=gameOver style="text-align: center;">
      <h2>THERE WAS NO UNICORN...</h2>
      <hr><p>i lied. there was no unicorn actually</p><hr>
      <p>it took you <span id=clickNum2></span> clicks and <span id=timeLen2></span> seconds just to find out it haven't existed...</p>
      <button onclick="download()">DOWNLOAD MAP.</button> | <button onclick="location.reload()">RESTART?</button>
    </dialog>
    <script>
      const [cols, rows] = ['width', 'height'].map(x => Math.floor(mains.getBoundingClientRect()[x] / 35 )) /*line from gpt*/
      const actx = new AudioContext();
      const sign = n => Math.sign(n) || 0;
        console.log(cols,rows)
      clicks=0
      start = 0
      chain=[]
      function createTable () {
        for (i=0;i<rows;i++){
          tr = document.createElement('tr')
          for (j=0;j<cols;j++){
            td = document.createElement('td')
            td.innerHTML=`<button data-state='0' data-position='[${i},${j}]' onclick='clickHandler(${i},${j},this)'></button>`
            tr.appendChild(td)
          }
          main.appendChild(tr)
        }
      }
      function winner(bool){
      // both popups cause why not? ¬_,¬
        clickNum.innerText = clicks
        clickNum2.innerText = clicks
        end = performance.now()
        console.log(start,end)
        // update records table if won
        if(bool) localStorage.setItem('find_the_unicorn_leaderboard',JSON.stringify([...JSON.parse(localStorage.getItem('find_the_unicorn_leaderboard')||"[]"),{clicks:clicks,time:((end-start)/1000).toFixed(2),date:new Date()}]))
        timeLen.innerText = `${((end-start)/1000).toFixed(2)}`
        timeLen2.innerText = `${((end-start)/1000).toFixed(2)}`
        bool?gameWin.showModal():gameOver.showModal()
      }
      function clickHandler(i,j,elem){
      // -1: clicked ; 0 - to click ; 1 - non-reachable
        if (elem.dataset.state==0) {
          // initial board lockup
          if (clicks==0){
            document.querySelectorAll("td>button").forEach(e=>{e.dataset.state=1;e.disabled=true})
          }
          // uncover nearby tiles, 8 around clicked tile
          for (let di = -1; di <= 1; di++) {
            for (let dj = -1; dj <= 1; dj++) {
              if (di == 0 && dj == 0) continue;
              let x = (i + di + rows) % rows;
              let y = (j + dj + cols) % cols;
              cell = document.querySelector(`[data-position='[${x},${y}]']`)
              if (cell?.dataset.state !== "-1"){cell.dataset.state = "0";cell.disabled=false}
            }
          }
          clicks++
          chain.push([i,j])
          elem.style.background = `hsl(${clicks},100%,50%)`
          elem.dataset.state=-1
          console.log(i,j,clicks,chain)
          stairClick() // ← crappy audio
          prob = nextPossibles(chain)
          elem.innerText=prob[1]
          // check for win/fail conditions
          if(clicks>10){ // win
            ran = Math.random()
            if (ran*2<Math.pow(prob[0],2)){
              winner(1)
            }
          }
          if([...document.querySelectorAll('[data-state]')].every(el => el.getAttribute('data-state') === '-1')){ // fail
            winner(0)
          }
        }
      }
      /**/
      /* gpt block*/
      /**/
      function stairClick() {
        const t = actx.currentTime;

        // position within the cycle: 0..1, wraps around
        const pos = (clicks % 12) / 12;

        for (let i = 0; i < 5; i++) {
          // octave-spaced tones, shifted by cycle position
          const freq = 55 * Math.pow(2, i + pos);

          const osc = actx.createOscillator();
          osc.type = "sine";
          osc.frequency.value = freq;

          const gain = actx.createGain();
          // fade in at bottom of range, out at top
          const env = Math.sin(Math.PI * ((i + pos) / 5));
          gain.gain.setValueAtTime(env * 0.2, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);

          osc.connect(gain).connect(actx.destination);
          osc.start(t);
          osc.stop(t + 0.2);
        }
      }
      function download(){
        const rows = [...main.rows];
        const height = rows.length;
        const width = Math.max(...rows.map(row => row.cells.length));
        const canvas = document.createElement("canvas");
        canvas.width = width*10;
        canvas.height = height*10;
        const ctx = canvas.getContext("2d");
        rows.forEach((row, y) => {
          [...row.cells].forEach((cell, x) => {
            const button = cell.querySelector("button");
            // getComputedStyle resolves HSL, CSS variables, etc.
            const color = getComputedStyle(button).backgroundColor;
            ctx.fillStyle = color;
            ctx.fillRect(x*10, y*10, 10, 10);
          });
        });
        canvas.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          /*from stackoverflow*/
          d = new Date;
          var dd = String(d.getDate()).padStart(2, '0');
          var mm = String(d.getMonth() + 1).padStart(2, '0'); //January is 0!
          var yyyy = d.getFullYear();
          a.download = `find_unicorn_save_${yyyy}_${mm}_${dd}:${d.getHours()}_${d.getMinutes()}.png`;
          /*end of stackoverflow*/
          a.click();
          URL.revokeObjectURL(url);
        }, "image/png");
      }
      /**/
      /* gpt block end*/
      /**/
      function nextPossibles(arr){
        directs = arr.map((p, i) => i ? [sign(p[0]-arr[i-1][0]), sign(p[1]-arr[i-1][1])] : null).filter(Boolean); /*line from gpt*/  // output: [01,10,0-1,-10]
        probs = {"N":0,"S":0,"E":0,"W":0,"NE":0,"NW":0,"SE":0,"SW":0}
        // send help - idk how to make it smaller... ;-;
        // counting directions player moved
        directs.forEach(([x, y]) => {
          if (x == 0 && y == 1) probs.N++;
          else if (x == 0 && y == -1) probs.S++;
          else if (x == 1 && y == 0) probs.E++;
          else if (x == -1 && y == 0) probs.W++;
          else if (x == 1 && y == 1) probs.NE++;
          else if (x == -1 && y == 1) probs.NW++;
          else if (x == 1 && y == -1) probs.SE++;
          else if (x == -1 && y == -1) probs.SW++;
        });
        console.log(directs,probs)
        last = directs[directs.length-1]
        // returning how probable was last move
        if (last[0] == -1 && last[1] == 0) return [probs.N / directs.length, "↑"];
        else if (last[0] == 1 && last[1] == 0) return [probs.S / directs.length, "↓"];
        else if (last[0] == 0 && last[1] == 1) return [probs.E / directs.length, "→"];
        else if (last[0] == 0 && last[1] == -1) return [probs.W / directs.length, "←"];
        else if (last[0] == -1 && last[1] == 1) return [probs.NE / directs.length, "↗"];
        else if (last[0] == -1 && last[1] == -1) return [probs.NW / directs.length, "↖"];
        else if (last[0] == 1 && last[1] == 1) return [probs.SE / directs.length, "↘"];
        else if (last[0] == 1 && last[1] == -1) return [probs.SW / directs.length, "↙"];
        else return [directs.length, "•"]; // idk why but somehow this dot doesn't render while should...
      }
      window.onload = () => {
        // leaderboards
        scores = JSON.parse(localStorage.getItem('find_the_unicorn_leaderboard'))?.sort((a, b) => a.clicks - b.clicks).slice(0,10);
        scores?.forEach((e)=>{
          entry = document.createElement('li');
          entry.innerHTML = `<time>${new Date(e.date).toLocaleDateString("en-US",{year: 'numeric', month: 'long', day: 'numeric'})}<time> => ${e.clicks} clicks and ${e.time}secs`;
          hallOfFame.appendChild(entry);
        })
        // inverted cause why not??? (:
        antiscores = JSON.parse(localStorage.getItem('find_the_unicorn_leaderboard'))?.sort((a, b) => b.clicks - a.clicks).slice(0,10);
        antiscores?.forEach((e)=>{
          entry = document.createElement('li');
          entry.innerHTML = `<time>${new Date(e.date).toLocaleDateString("en-US",{year: 'numeric', month: 'long', day: 'numeric'})}<time> => ${e.clicks} clicks and ${e.time}secs`;
          hallOfShame.appendChild(entry);
        })
        // and init
        createTable();
        start=performance.now()
      }
    </script>
  </body>
</html>
